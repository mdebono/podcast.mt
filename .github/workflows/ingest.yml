name: RSS Ingestion & Deploy

permissions:
  contents: read

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

  # Also run on pushes to main (e.g. when you edit shows.json)
  push:
    branches:
      - main
    paths:
      - 'data/shows.json'        # new/updated show entries
      - 'scripts/ingest.js'      # script changes
      - 'src/**'                 # site source changes

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RSS ingestion
        run: node scripts/ingest.js

      # Keep the generated data as a downloadable workflow artifact instead of
      # committing it: the Vercel build re-runs ingestion itself (npm run build)
      - name: Upload ingested data
        uses: actions/upload-artifact@v4
        with:
          name: ingested-data
          path: |
            data/episodes.json
            data/shows-enriched.json
            data/ingest-summary.json
          retention-days: 14

      - name: Show ingestion summary
        run: |
          cat data/ingest-summary.json
          {
            echo '### Ingestion summary'
            echo '```json'
            cat data/ingest-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Decide whether to call the deploy hook:
      # - push: no, Vercel's Git integration already deploys every push
      # - schedule: only if the ingested data differs from what the live site
      #   was built with (published as /data-version.txt)
      # - manual run: always
      - name: Check whether data changed
        id: changes
        env:
          SITE_URL: https://podcast.mt
          EVENT: ${{ github.event_name }}
        run: |
          NEW=$(node -p "require('./data/ingest-summary.json').dataVersion")
          LIVE=$(curl -fsS "$SITE_URL/data-version.txt" | tr -d '[:space:]' || true)
          echo "New data version:  $NEW"
          echo "Live data version: ${LIVE:-unknown}"
          if [ "$EVENT" = "push" ]; then
            echo "Push event, Vercel deploys it via Git integration."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && [ "$NEW" = "$LIVE" ]; then
            echo "No changes since the last deploy, skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # Trigger a Vercel deployment via deploy hook
      # Add your hook URL as a secret: Settings → Secrets → VERCEL_DEPLOY_HOOK
      # (a step's own env isn't visible to its `if`, so the secret is checked
      # inside the script)
      - name: Trigger Vercel deploy
        if: steps.changes.outputs.deploy == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set, the site was not redeployed."
            exit 1
          fi
          echo "Triggering Vercel deploy…"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -X POST "$VERCEL_DEPLOY_HOOK"

      # Optional: notify you on Slack/email if there were feed errors
      - name: Check for errors
        run: |
          ERRORS=$(node -e "
            const s = require('./data/ingest-summary.json');
            console.log(s.errorCount);
          ")
          if [ "$ERRORS" -gt "0" ]; then
            echo "::warning::$ERRORS feed(s) failed to ingest. See the run summary or the ingested-data artifact."
          fi
