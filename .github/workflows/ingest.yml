name: RSS Ingestion & Deploy

permissions:
  contents: read

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

  # Also run on pushes to main (e.g. when you edit shows.json)
  push:
    branches:
      - main
    paths:
      - 'data/shows.json'        # new/updated show entries
      - 'scripts/ingest.js'      # script changes
      - 'src/**'                 # site source changes

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RSS ingestion
        run: node scripts/ingest.js

      # Keep the generated data as a downloadable workflow artifact instead of
      # committing it: the Vercel build re-runs ingestion itself (npm run build)
      - name: Upload ingested data
        uses: actions/upload-artifact@v4
        with:
          name: ingested-data
          path: |
            data/episodes.json
            data/shows-enriched.json
            data/ingest-summary.json
          retention-days: 14

      - name: Show ingestion summary
        run: |
          cat data/ingest-summary.json
          {
            echo '### Ingestion summary'
            echo '```json'
            cat data/ingest-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Trigger a Vercel deployment via deploy hook
      # Add your hook URL as a secret: Settings → Secrets → VERCEL_DEPLOY_HOOK
      - name: Trigger Vercel deploy
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel deploy…"
          curl -s -o /dev/null -w "HTTP %{http_code}" -X POST "$VERCEL_DEPLOY_HOOK"
          echo ""

      # Optional: notify you on Slack/email if there were feed errors
      - name: Check for errors
        run: |
          ERRORS=$(node -e "
            const s = require('./data/ingest-summary.json');
            console.log(s.errorCount);
          ")
          if [ "$ERRORS" -gt "0" ]; then
            echo "::warning::$ERRORS feed(s) failed to ingest. See the run summary or the ingested-data artifact."
          fi
